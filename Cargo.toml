[workspace]
members = ["xann-core", "xann-frontend", "xann-interpreter", "xann-compiler", "xann-cli"]
default-members = ["xann-cli"]
resolver = "2"

[workspace.package]
version = "0.0.1-alpha.17"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0.86"
debug_print = "1.0.0"
pretty = "0.12.3"
xann-core = { path = "xann-core" }
xann-frontend = { path = "xann-frontend" }
xann-interpreter = { path = "xann-interpreter" }
xann-compiler = { path = "xann-compiler" }
